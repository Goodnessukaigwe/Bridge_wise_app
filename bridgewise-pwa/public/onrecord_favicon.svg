<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#17104A"/>
  <!-- Inner circle glow -->
  <circle cx="31" cy="30" r="23" fill="#221860"/>
  <!-- O-ring -->
  <circle cx="31" cy="30" r="15" fill="none" stroke="white" stroke-width="4.5"/>
  <!-- Ledger lines inside the O -->
  <line x1="24" y1="27" x2="38" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.88"/>
  <line x1="24" y1="30" x2="38" y2="30" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.88"/>
  <line x1="24" y1="33" x2="32" y2="33" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.88"/>
  <!-- Amber check badge -->
  <circle cx="44" cy="44" r="7" fill="#F59E0B"/>
  <polyline points="41,44 43,46.5 47,41.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
